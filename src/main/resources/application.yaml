spring:
  application:
    name: pick-eat-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pick_eat}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:1800000}
  refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}

cors:
  # 쉼표로 구분한 허용 origin 목록. 패턴(https://*.vercel.app)도 쓸 수 있다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}

storage:
  s3:
    # 후기 이미지 버킷. 비어 있으면 업로드 URL 발급만 REVIEW_006으로 거부하고 나머지 기능은 정상 동작한다.
    bucket: ${REVIEW_IMAGE_BUCKET:}
    region: ${REVIEW_IMAGE_REGION:ap-northeast-2}
  # 이미지를 제공하는 주소(CloudFront 도메인 등). 비어 있으면 S3 버킷 주소를 그대로 쓴다.
  public-base-url: ${REVIEW_IMAGE_BASE_URL:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
