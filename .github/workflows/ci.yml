name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pick_eat
          POSTGRES_USER: pick_eat
          POSTGRES_PASSWORD: pick_eat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pick_eat -d pick_eat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/pick_eat
      DB_USERNAME: pick_eat
      DB_PASSWORD: pick_eat
      JWT_SECRET: pickeat-ci-secret-key-long-enough-for-hs256-signing

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain
